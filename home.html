<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相談会ナビ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfbf6;--panel:#fff;--ink:#16323a;--sub:#5b7077;--line:#e6dfd2;--acc:#0d7e87;--accbg:#d9f0f1;--hot:#ff7a59}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Yu Gothic UI","Meiryo",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:2px solid var(--line)}
h1{margin:0;font-size:24px}
main{padding:20px 24px;max-width:980px;margin:0 auto}
.card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.card b{font-size:19px}
.sub{color:var(--sub);font-size:14px;margin-left:6px}
.card .sub:last-child{display:block;margin:4px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a,button{font:inherit;font-size:15px;padding:6px 14px 6px 8px;border-radius:12px;border:2px solid var(--acc);background:var(--panel);color:var(--ink);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ic{width:30px;height:30px;object-fit:contain}
.ic[src=""],.ic.broken{display:none}
button.del{border-color:#f3b4a3;color:#c2410c;background:#fff6f2}
.main{background:var(--acc);color:#fff}
.quiet{border-color:var(--line);color:var(--sub)}
.hint{color:var(--sub);font-size:14px;line-height:1.7;margin:4px 0 16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .3s}
#toast.on{opacity:.92}
</style>
</head>
<body>
<header><h1>相談会ナビ</h1><div class="btns"><button class="main" onclick="newNote()"><img class="ic" src="/icon/new.png" alt="">新しい回を作る</button><button class="quiet" onclick="quit()"><img class="ic" src="/icon/quit.png" alt="">終了</button></div></header>
<main>
<p class="hint">「編集」で話題・要点・見せる画面(URL)・メモを手で埋めて保存すると、Obsidian の相談会ノートに書き込まれます。<br>
「進行ナビ」が画面共有する画面、「デモの窓」は今日見せる画面だけを並べた別の窓です。</p>
__ROWS__
</main>
<div id="toast"></div>
<script>
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});return r.json()}
async function demo(n){const r=await post("/api/demo?n="+encodeURIComponent(n));toast(r.count?`デモの窓を開きました(画面 ${r.count} 個)`:"見せる画面(URL)がまだありません。編集で足してください")}
async function delNote(btn){const n=btn.dataset.n,title=btn.dataset.title;if(!confirm(`「${title}」を消しますか?\n(Obsidian のごみ箱に移すので、あとから戻せます)`))return;const r=await post("/api/delete?n="+encodeURIComponent(n));if(r.ok)location.reload();else toast("消せませんでした")}
async function newNote(){const r=await post("/api/new");location.href="/edit?n="+encodeURIComponent(r.n)}
async function quit(){if(!confirm("相談会ナビを終了しますか?(保存済みの内容は消えません)"))return;await post("/api/quit");document.body.innerHTML="<p style='padding:40px;font-size:20px'>終了しました。この窓は閉じてかまいません。</p>"}
</script>
</body>
</html>
